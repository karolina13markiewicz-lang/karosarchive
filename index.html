
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karo's Archive</title>
    <link rel="stylesheet" href="css/normal.css">
</head>

<body>

    <input type="checkbox" id="darkmode">

    <div class="website">

        <label for="darkmode" class="theme-button">DARK / LIGHT</label>

        <header>
            <h1>KARO'S ARCHIVE</h1>
            <p>MY PERSONAL VINYL COLLECTION</p>
        </header>

        <main>

            <section class="collection">

                <div class="genre">
                    <h2>HIP-HOP</h2>
                    <img src="images/iib.png" alt="IIB">
                    <img src="images/konnichiwa.jpg" alt="Konnichiwa">
                    <img src="images/mmatbs.jpeg" alt="Mr Morale">
                    <img src="images/spiderman.jpeg" alt="Spider-Man">
                </div>

                <div class="genre">
                    <h2>POLISH</h2>
                    <img src="images/marmur.jpeg" alt="Marmur">
                    <img src="images/myslovitz.jpg" alt="Myslovitz">
                    <img src="images/pezet.jpeg" alt="Pezet">
                </div>

                <div class="genre">
                    <h2>POP</h2>
                    <img src="images/brat.png" alt="Brat">
                    <img src="images/positions.png" alt="Positions">
                    <img src="images/unapologetic.jpg" alt="Unapologetic">
                </div>

                <div class="genre">
                    <h2>POP / ROCK</h2>
                    <img src="images/bmth.jpg" alt="Bring Me The Horizon">
                    <img src="images/nbhd.jpg" alt="The Neighbourhood">
                    <img src="images/wipedout.jpg" alt="Wiped Out">
                </div>

                <div class="genre">
                    <h2>R&B</h2>
                    <img src="images/anti.png" alt="Anti">
                    <img src="images/ctrl.jpeg" alt="Ctrl">
                    <img src="images/jorja.jpeg" alt="Jorja Smith">
                </div>

            </section>

            <section class="turntable">
                <img src="images/turntable.png" alt="Silver vinyl record player">
            </section>

        </main>

    </div>

</body>
</html>
